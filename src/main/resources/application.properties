spring.application.name=civicwatch

# Uses an in-memory H2 database by default so a fresh Render deployment can start.
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in Render to use an external database.
spring.datasource.url=${DB_URL:jdbc:h2:mem:civicwatch;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Admin login is enabled only when ADMIN_PASSWORD is configured in the host environment.
civicwatch.admin.username=${ADMIN_USERNAME:admin}
civicwatch.admin.password=${ADMIN_PASSWORD:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
civicwatch.upload-dir=uploads
