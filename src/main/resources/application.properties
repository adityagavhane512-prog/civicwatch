spring.application.name=civicwatch

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicwatch}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

civicwatch.admin.username=${ADMIN_USERNAME}
civicwatch.admin.password=${ADMIN_PASSWORD}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
civicwatch.upload-dir=uploads